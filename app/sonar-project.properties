# SonarQube analysis settings for inventory-api.
# Read by sonar-scanner from the app/ directory (the Jenkinsfile runs the scanner there).
# The server URL and token are NOT set here: Jenkins injects them via withSonarQubeEnv,
# so this file is safe to commit.

sonar.projectKey=inventory-api
sonar.projectName=inventory-api
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.sourceEncoding=UTF-8

# Coverage produced by `npm test` (Jest, lcov reporter) in the Unit tests stage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# server.js only wires the listener and signal handlers; app.js holds the logic under test.
sonar.coverage.exclusions=src/server.js

sonar.exclusions=node_modules/**,coverage/**,reports/**
