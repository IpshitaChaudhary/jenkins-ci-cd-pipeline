# Local Jenkins + SonarQube to run this pipeline end to end on one machine.
#   docker compose -f ci/docker-compose.yml up -d --build
# Jenkins:   http://localhost:8080   (initial admin password: see README)
# SonarQube: http://localhost:9000   (admin / admin on first login, forced change)

name: jenkins-ci

services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      # The pipeline starts its stages in containers (node, sonar-scanner) and builds the image,
      # so Jenkins talks to the host's Docker daemon. Fine for a local lab; on a shared server use
      # dedicated build agents instead - this socket is root-equivalent on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.7-community
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar-local-only}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar-local-only}
      - POSTGRES_DB=sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:
