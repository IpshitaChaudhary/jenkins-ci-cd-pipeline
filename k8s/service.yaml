# ClusterIP only: put an Ingress or a LoadBalancer in front if it needs outside traffic.
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Voluntary disruptions (node drain, cluster upgrade) may evict at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-api
  namespace: inventory
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
